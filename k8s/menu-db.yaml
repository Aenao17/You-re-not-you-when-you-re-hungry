apiVersion: apps/v1
kind: Deployment
metadata:
  name: menu-db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: menu-db
  template:
    metadata:
      labels:
        app: menu-db
    spec:
      containers:
        - name: postgres
          image: postgres:16
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: menu_db
            - name: POSTGRES_USER
              value: menu
            - name: POSTGRES_PASSWORD
              value: password
---
apiVersion: v1
kind: Service
metadata:
  name: menu-db
spec:
  selector:
    app: menu-db
  ports:
    - port: 5432
      targetPort: 5432