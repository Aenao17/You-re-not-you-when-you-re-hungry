apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: api-gateway:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_DOCKER_COMPOSE_ENABLED
              value: "false"
            - name: USER_SERVICE_URL
              value: http://user-service:8081
            - name: MENU_SERVICE_URL
              value: http://menu-service:8082
            - name: ORDER_SERVICE_URL
              value: http://order-service:8083
            - name: JWT_SECRET
              value: 5367566859703373367639792F423F452848284D6251655468576D5A71347437
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
spec:
  type: NodePort
  selector:
    app: api-gateway
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080