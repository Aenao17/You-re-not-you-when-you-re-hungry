server.port=8083
spring.application.name=order-service

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5435/order_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:order_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:password}

spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.docker.compose.lifecycle-management=start-and-stop
spring.docker.compose.file=./order-service/compose.yaml

menu.service.base-url=${MENU_SERVICE_URL:http://localhost:8082}
user.service.base-url=${USER_SERVICE_URL:http://localhost:8081}
